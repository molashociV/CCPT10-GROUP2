        <div class="music-box" id="musicBox">
            <button id="musicClose" class="music-close" type="button" aria-label="Close music box">×</button>

            <span>Background Music</span>

            <button id="musicToggle" type="button">▶ Play</button>

            <label for="musicVolume">Volume</label>
            <input id="musicVolume" type="range" min="0" max="1" step="0.01" value="0.5">
        </div>

        <button id="musicOpen" class="music-open" type="button">🎵 Open Music</button>

        <audio id="bgMusic" loop>
            <source src="on.mp3" type="audio/mpeg">
            <source src="on.ogg" type="audio/ogg">
        </audio>

        <script>
            const music = document.getElementById("bgMusic");
            const musicBox = document.getElementById("musicBox");
            const musicOpen = document.getElementById("musicOpen");
            const musicClose = document.getElementById("musicClose");
            const toggleButton = document.getElementById("musicToggle");
            const volumeControl = document.getElementById("musicVolume");

            music.volume = 0.5;

            toggleButton.addEventListener("click", async () => {
                if (music.paused) {
                    await music.play();
                    toggleButton.textContent = "❚❚ Pause";
                } else {
                    music.pause();
                    toggleButton.textContent = "▶ Play";
                }
            });

            volumeControl.addEventListener("input", () => {
                music.volume = Number(volumeControl.value);
            });

            musicClose.addEventListener("click", () => {
                music.pause();
                toggleButton.textContent = "▶ Play";
                musicBox.classList.add("hidden");
                musicOpen.classList.add("visible");
            });

            musicOpen.addEventListener("click", () => {
                musicBox.classList.remove("hidden");
                musicOpen.classList.remove("visible");
            });
        </script>
        </div> <!-- closes .container -->
